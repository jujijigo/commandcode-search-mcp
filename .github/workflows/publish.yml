name: Publish

# 推送 v* tag 时发布到 npm，发布后立刻验证 registry 上的产物。
#
# 认证走 npm Trusted Publishing（OIDC），不需要任何长期 token。
# 前置配置（一次性）：在 npmjs.com 的包设置里填 Trusted Publisher —
#   Organization/user: kywrl
#   Repository:        commandcode-mcp-server
#   Workflow filename: publish.yml
# 该配置不匹配时不会提前报错，只会在 npm publish 时以 ENEEDAUTH 失败。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token 用于 OIDC 换取 npm 的短期凭据，同时自动生成 provenance
    permissions:
      id-token: write
      contents: read
    # 供下游的 verify 工作流读取（workflow_run 拿不到本次 push 的 tag 名）
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Trusted Publishing 要求 Node >= 22.14 且 npm >= 11.5.1；
          # 版本过低会在 publish 时报错，且错误信息不会直接指向版本问题
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # 官方建议 release 构建禁用缓存，避免缓存污染发布产物
          package-manager-cache: false

      - name: Check tag matches package.json version
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$pkg_version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 的版本 ${pkg_version} 不一致"
            echo "通常意味着 tag 打在了错误的 commit 上"
            exit 1
          fi
          echo "tag 与 package.json 一致：${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # 这里的成功只代表「发布成功」，不代表包可用。产物验证由
      # verify-published.yml 通过 workflow_run 在发布完成后接手——
      # 拆开是因为验证要读 registry 元数据，而刚发布完的那个 runner
      # 常拿到陈旧缓存（1.0.2 那次 2 分钟都没刷新），换一个全新 runner
      # 能绕开这个问题，也不必让发布结果被验证的时序问题拖累。
      - name: Publish to npm
        id: publish
        run: |
          npm publish --access public --provenance
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
