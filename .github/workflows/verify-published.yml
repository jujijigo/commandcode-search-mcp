name: Verify published

# 只做「复验」，不监听 tag：publish.yml 在发布后已经验证过一次，若这里也监听
# tag，两个工作流会并行启动，此时包往往还没发布完，必然误报失败（1.0.1 就是这样
# 红过一次）。发布失败、手动补发、或想验证任意历史版本时，从这里手动触发。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '要验证的版本或 dist-tag（留空则用 package.json 里的版本号）'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # 脚本自身 import 了 @modelcontextprotocol/sdk，依赖必须先装好
      - name: Install dependencies
        run: npm ci

      - name: Verify published package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for attempt in $(seq 1 6); do
            if npm run verify:published ${VERSION:+"$VERSION"}; then
              exit 0
            fi
            if [ "$attempt" = 6 ]; then
              echo "::error::连续 6 次验证失败"
              exit 1
            fi
            echo "第 ${attempt} 次未通过，20 秒后重试（registry 传播延迟）"
            sleep 20
          done
